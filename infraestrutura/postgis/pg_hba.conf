# =====================================================================
# pg_hba.conf do container postgis (copiado para o PGDATA na 1a subida)
# Vale a PRIMEIRA linha que casar.
# =====================================================================
# TYPE     DATABASE  USER                                  ADDRESS   METHOD

# Socket local (docker compose exec postgis psql ...). R4 do roles.sql:
# risco aceito, exige acesso ao container.
local      all       all                                             trust

# Somente a API, por TLS, a partir da rede interna do compose (samenet).
hostssl    casaos    api_mapas_leitura,api_mapas_escrita   samenet   scram-sha-256

# Todo o resto e recusado (inclusive casaos e mapas_teste por TCP).
host       all       all                                   all       reject
