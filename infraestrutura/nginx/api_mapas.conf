# =====================================================================
# nginx na frente da api_mapas (montado em /etc/nginx/conf.d/default.conf)
#
# A API nao tem autenticacao e so ouve em 127.0.0.1:5080 (RA-5). Este
# container compartilha o namespace de rede com ela, entao 127.0.0.1 e a
# propria API. Aqui ficam o TLS, a autenticacao basica e o rate limit por
# IP real (a API ve todas as requisicoes vindas de 127.0.0.1).
# =====================================================================

server_tokens off;

# REC-A1 por IP real: 60/min no total e 10/min de escrita (mesmos valores
# padrao do appsettings.json).
map $request_method $limite_escrita {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=api_geral:10m rate=60r/m;
limit_req_zone $limite_escrita zone=api_escrita:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!eNULL:!MD5:!3DES:!RC4;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Teto do corpo do PUT/POST na API: LimiteBytesCorpoPut <= 1 MiB.
    client_max_body_size 1m;

    auth_basic           "api_mapas";
    auth_basic_user_file /etc/nginx/segredos/htpasswd;

    location /api/mapas/ {
        limit_req zone=api_geral burst=10 nodelay;
        limit_req zone=api_escrita burst=2 nodelay;

        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        # AllowedHosts da API: localhost;127.0.0.1;[::1]
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        # A credencial do nginx nao segue para a API.
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
